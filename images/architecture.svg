<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A9B0A5"/>
    </marker>
  </defs>

  <rect width="1200" height="360" fill="#FFFFFF"/>

  <!-- layer bands -->
  <rect x="40" y="40" width="220" height="280" rx="10" fill="#EDEFEA"/>
  <text x="150" y="66" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7D8580">CLIENT</text>

  <rect x="300" y="40" width="260" height="280" rx="10" fill="#FBEDE9"/>
  <text x="430" y="66" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#C1432B">WEB LAYER</text>

  <rect x="600" y="40" width="260" height="280" rx="10" fill="#EDEFEA"/>
  <text x="730" y="66" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7D8580">SERVICE LAYER</text>

  <rect x="900" y="40" width="260" height="280" rx="10" fill="#FBEDE9"/>
  <text x="1030" y="66" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#C1432B">DATA LAYER</text>

  <!-- client node -->
  <rect x="70" y="150" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#A9B0A5" stroke-width="1.5"/>
  <text x="150" y="175" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#14181C">curl / browser</text>
  <text x="150" y="194" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#4A5058">POST /api/bookings</text>

  <!-- controller -->
  <rect x="330" y="150" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#C1432B" stroke-width="1.5"/>
  <text x="430" y="175" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#14181C">BookingController</text>
  <text x="430" y="194" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4A5058">translates HTTP, nothing else</text>

  <!-- service -->
  <rect x="630" y="150" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#A9B0A5" stroke-width="1.5"/>
  <text x="730" y="175" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#14181C">BookingService</text>
  <text x="730" y="194" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4A5058">the capacity rule lives here</text>

  <!-- data -->
  <rect x="930" y="130" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#C1432B" stroke-width="1.5"/>
  <text x="1030" y="155" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#14181C">BookingRepository</text>
  <text x="1030" y="174" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4A5058">Spring Data JPA</text>

  <rect x="930" y="210" width="200" height="50" rx="8" fill="#14181C"/>
  <text x="1030" y="232" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#EDEFEA">H2 (in-memory)</text>
  <text x="1030" y="249" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#9BA3AC">rebuilt from data.sql</text>

  <!-- arrows -->
  <line x1="230" y1="180" x2="326" y2="180" stroke="#A9B0A5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="180" x2="626" y2="180" stroke="#A9B0A5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="830" y1="172" x2="926" y2="160" stroke="#A9B0A5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1030" y1="190" x2="1030" y2="206" stroke="#A9B0A5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- footnote -->
  <text x="430" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#7D8580">DispatcherServlet + Jackson + @Valid</text>
  <text x="730" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#7D8580">@Transactional wraps the write</text>
  <text x="1030" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#7D8580">one INSERT, then commit</text>
</svg>
